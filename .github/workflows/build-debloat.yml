name: Build debloated system/product (A256E)

# Reproduce en GitHub el proceso verificado localmente:
#   firmware Samsung (ZIP remoto) -> super.img -> system/product
#   -> eliminar rutas de recovery-web/debloat/*.txt -> restaurar dueño, permisos,
#      SELinux y capabilities -> EROFS lz4hc -> verificación -> artifact.
# Las imágenes se flashean desde Recovery Web, pestaña "Super".
#
# Requiere el secret FIRMWARE_URL (enlace de descarga del ZIP de firmware, p. ej. samfw)
# o el input firmware_url al lanzarlo a mano.

on:
  push:
    branches: [recovery-web]
    paths:
      - "recovery-web/debloat/**"
      - "recovery-web/tools/erofs_meta.py"
      - "recovery-web/tools/build_partition.sh"
      - "recovery-web/tools/fw_super.py"
      - "recovery-web/tools/lpdump.py"
      - ".github/workflows/build-debloat.yml"
  workflow_dispatch:
    inputs:
      firmware_url:
        description: "Enlace de descarga del ZIP de firmware (si no hay secret FIRMWARE_URL)"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      WORK: /mnt/work
      TOOLS: ${{ github.workspace }}/recovery-web/tools
      DEBLOAT: ${{ github.workspace }}/recovery-web/debloat
    steps:
      - uses: actions/checkout@v4

      - name: Enlace de firmware
        id: fw
        env:
          FW_INPUT: ${{ inputs.firmware_url }}
          FW_SECRET: ${{ secrets.FIRMWARE_URL }}
        run: |
          url="${FW_INPUT:-$FW_SECRET}"
          if [ -z "$url" ]; then
            echo "::warning::Sin enlace de firmware: crea el secret FIRMWARE_URL (o usa el input firmware_url) y vuelve a lanzar el workflow"
            echo "### No se ha compilado nada: falta el secret FIRMWARE_URL" >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$url"
          sudo mkdir -p "$WORK" && sudo chown "$USER" "$WORK"
          printf '%s' "$url" > "$WORK/url.txt"

      - name: Liberar disco
        if: steps.fw.outputs.ok == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / /mnt

      - name: Dependencias
        if: steps.fw.outputs.ok == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq erofs-utils
          pip install --quiet lz4

      - name: Extraer super.img del firmware
        if: steps.fw.outputs.ok == 'true'
        run: python3 -I "$TOOLS/fw_super.py" "$WORK/url.txt" "$WORK/super.raw"

      - name: Particiones lógicas
        if: steps.fw.outputs.ok == 'true'
        run: |
          python3 -I "$TOOLS/lpdump.py" "$WORK/super.raw" --extract "$WORK/parts" --only system,product
          rm -f "$WORK/super.raw" "$WORK/url.txt"
          df -h /mnt

      - name: product
        if: steps.fw.outputs.ok == 'true'
        run: |
          sudo bash "$TOOLS/build_partition.sh" "$WORK/parts/product.img" "$DEBLOAT/product.txt" "$WORK/out/product.img" "$WORK/w_product"
          sudo rm -rf "$WORK/w_product/src" "$WORK/w_product/check" "$WORK/parts/product.img"

      - name: system
        if: steps.fw.outputs.ok == 'true'
        run: |
          sudo bash "$TOOLS/build_partition.sh" "$WORK/parts/system.img" "$DEBLOAT/system.txt" "$WORK/out/system.img" "$WORK/w_system"
          sudo rm -rf "$WORK/w_system/src" "$WORK/w_system/check" "$WORK/parts/system.img"

      - name: Resumen
        if: steps.fw.outputs.ok == 'true'
        run: |
          cd "$WORK/out"
          sudo chown -R "$USER" .
          sha256sum *.img | tee SHA256SUMS
          cp "$DEBLOAT"/*.txt .
          {
            echo "### Imágenes generadas"
            echo '```'
            ls -la *.img
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.fw.outputs.ok == 'true'
        with:
          name: A256E-debloat-system-product
          path: ${{ env.WORK }}/out/
          compression-level: 0
          retention-days: 14
