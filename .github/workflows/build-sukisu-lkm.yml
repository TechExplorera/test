name: Build SukiSU LKM (A256E)

# Compila SukiSU como módulo cargable (kernelsu.ko, modo LKM) contra el código
# fuente del Galaxy A25 (SM-A256E, Linux 5.10, android12-5.10).
#
# Modos (entrada "mode"):
#   full  -> compila el kernel entero para tener un Module.symvers real; modpost
#            comprueba TODOS los símbolos y genera los CRC de CONFIG_MODVERSIONS.
#            Es el único que produce un .ko realmente cargable. ~25 min.
#   fast  -> solo prepara el árbol (modules_prepare) y compila el módulo con
#            KBUILD_MODPOST_WARN=1. ~5 min, pero NO comprueba símbolos: sirve para
#            ver si el código del módulo compila, no para un .ko final.

on:
  push:
  workflow_dispatch:
    inputs:
      kernel_url:
        description: "URL git del código del kernel"
        default: https://github.com/TechExplorera/SM-A256E
      kernel_ref:
        description: "Rama/commit del kernel (main = código original de Samsung)"
        default: main
      defconfig:
        description: "Defconfig del kernel"
        default: s5e8825-a25xdxx_defconfig
      sukisu_url:
        description: "URL git de SukiSU"
        default: https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
      sukisu_ref:
        description: "Commit/rama de SukiSU (main = SukiSU-Nova con soporte LKM)"
        default: c60f21b9e00e35e898f8d21e0612465b76b9beec
      mode:
        description: "full = kernel completo + .ko cargable; fast = solo probar que el módulo compila"
        default: full
        type: choice
        options:
          - full
          - fast

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KERNEL_URL: ${{ inputs.kernel_url || 'https://github.com/TechExplorera/SM-A256E' }}
  KERNEL_REF: ${{ inputs.kernel_ref || 'main' }}
  DEFCONFIG: ${{ inputs.defconfig || 's5e8825-a25xdxx_defconfig' }}
  SUKISU_URL: ${{ inputs.sukisu_url || 'https://github.com/SukiSU-Ultra/SukiSU-Ultra.git' }}
  SUKISU_REF: ${{ inputs.sukisu_ref || 'c60f21b9e00e35e898f8d21e0612465b76b9beec' }}
  MODE: ${{ inputs.mode || 'full' }}
  CLANG_VERSION: clang-r416183b
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz
  MAKE_ARGS: >-
    ARCH=arm64 LLVM=1 LLVM_IAS=1
    PLATFORM_VERSION=12 ANDROID_MAJOR_VERSION=s TARGET_SOC=s5e8825
    CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Fetch kernel source
        run: |
          git clone -q --depth 1 "$KERNEL_URL" kernel
          if [ "$KERNEL_REF" != "HEAD" ] && ! git -C kernel rev-parse --verify -q "$KERNEL_REF^{commit}" >/dev/null; then
            git -C kernel fetch -q --depth 1 origin "$KERNEL_REF"
            git -C kernel checkout -q FETCH_HEAD
          fi
          git -C kernel log -1 --format='Kernel: %h %ad %s' --date=short | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fetch SukiSU
        run: |
          git init -q sukisu
          git -C sukisu remote add origin "$SUKISU_URL"
          git -C sukisu fetch -q --depth 1 origin "$SUKISU_REF"
          git -C sukisu checkout -q FETCH_HEAD
          git -C sukisu log -1 --format='SukiSU: %h %ad %s' --date=short | tee -a "$GITHUB_STEP_SUMMARY"
          rm -rf sukisu/.git  # evita que su Makefile intente "git fetch --unshallow"
          test -f sukisu/kernel/Kbuild || { echo "Esta versión de SukiSU no trae Kbuild para LKM"; exit 1; }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex cpio kmod lz4 rsync python3 \
            libssl-dev libelf-dev \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Cache AOSP clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/toolchain/${{ env.CLANG_VERSION }}
          key: aosp-${{ env.CLANG_VERSION }}

      - name: Download AOSP clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchain/$CLANG_VERSION
          curl -sSfL --retry 3 "$CLANG_URL" | tar -xz -C ~/toolchain/$CLANG_VERSION

      - name: Set up toolchain
        run: |
          echo "$HOME/toolchain/$CLANG_VERSION/bin" >> "$GITHUB_PATH"
          "$HOME/toolchain/$CLANG_VERSION/bin/clang" --version

      - name: Configure kernel (${{ env.DEFCONFIG }})
        working-directory: kernel
        run: |
          # El código original de Samsung no compila con -Werror=implicit-int sin esto
          [ -f kernel/sched/ems/sysbusy.c ] && \
            sed -i 's/^static cpn_next_cpu\[/static int cpn_next_cpu[/' kernel/sched/ems/sysbusy.c || true
          make $MAKE_ARGS "$DEFCONFIG"
          scripts/config --file .config --set-str UNUSED_KSYMS_WHITELIST gki/abi_symbollist.raw
          make $MAKE_ARGS olddefconfig
          grep -E '^CONFIG_(KPROBES|MODVERSIONS|MODULE_SIG|TRIM_UNUSED_KSYMS|KDP_CRED|KSU)[= ]' .config || true

      # Samsung activa CONFIG_KDP_CRED, así que put_cred() llama a un símbolo interno
      # (kdp_usecount_dec_and_test); además TRIM_UNUSED_KSYMS borra prepare_creds y
      # __put_cred. Sin esto, modpost falla con "undefined" en modo full.
      - name: Export cred symbols needed by SukiSU
        if: env.MODE == 'full'
        working-directory: kernel
        run: |
          for s in prepare_creds __put_cred kdp_usecount_dec_and_test; do
            grep -qxF "$s" gki/abi_symbollist.raw || echo "$s" >> gki/abi_symbollist.raw
          done
          if [ -f drivers/uh/kdp.c ] && ! grep -q 'EXPORT_SYMBOL(kdp_usecount_dec_and_test)' drivers/uh/kdp.c; then
            printf '\n#include <linux/export.h>\nEXPORT_SYMBOL(kdp_usecount_dec_and_test);\n' >> drivers/uh/kdp.c
          fi
          echo "Símbolos exportados: prepare_creds __put_cred kdp_usecount_dec_and_test" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build kernel (modo full -> Module.symvers real)
        if: env.MODE == 'full'
        working-directory: kernel
        run: |
          set -o pipefail
          make $MAKE_ARGS -j"$(nproc)" 2>&1 | tee ../kernel-build.log
          ls -la Module.symvers arch/arm64/boot/Image

      - name: Prepare modules (modo fast -> sin symvers)
        if: env.MODE == 'fast'
        working-directory: kernel
        run: |
          set -o pipefail
          make $MAKE_ARGS -j"$(nproc)" modules_prepare
          # SukiSU usa flask.h, que se genera al compilar SELinux
          make $MAKE_ARGS -j"$(nproc)" security/selinux/
          : > ../kernel-build.log
          echo "Modo fast: sin comprobación de símbolos (KBUILD_MODPOST_WARN=1)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build kernelsu.ko
        working-directory: kernel
        run: |
          set -o pipefail
          EXTRA=""
          [ "$MODE" = "fast" ] && EXTRA="KBUILD_MODPOST_WARN=1"
          make $MAKE_ARGS -j"$(nproc)" M="$GITHUB_WORKSPACE/sukisu/kernel" CONFIG_KSU=m $EXTRA modules \
            2>&1 | tee ../lkm-build.log
          grep -E '^-- ' ../lkm-build.log | sort -u | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Package module
        run: |
          mkdir -p dist
          cp sukisu/kernel/kernelsu.ko dist/kernelsu-a256e.ko
          llvm-strip -d dist/kernelsu-a256e.ko
          cp kernel/.config dist/kernel-config
          cp kernel-build.log lkm-build.log dist/ 2>/dev/null || true
          {
            echo "### kernelsu-a256e.ko ($MODE)"
            echo '```'
            modinfo dist/kernelsu-a256e.ko
            echo '```'
          } | tee dist/modinfo.txt >> "$GITHUB_STEP_SUMMARY"
          ls -la dist

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sukisu-lkm-a256e-${{ inputs.mode || 'full' }}-${{ github.sha }}
          path: |
            dist/
            kernel-build.log
            lkm-build.log
          if-no-files-found: warn
